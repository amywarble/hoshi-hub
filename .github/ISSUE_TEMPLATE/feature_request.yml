name: Pocket KGS feature request
description: Suggest an improvement to Pocket KGS.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are public. Do not include personal information, credentials, private messages, or sensitive safety reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What would this improve for Pocket KGS users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request concerns the Pocket KGS app rather than a change to the KGS server.
          required: true
