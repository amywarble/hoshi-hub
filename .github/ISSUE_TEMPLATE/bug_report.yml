name: Report a problem with Pocket KGS
description: Tell us what went wrong, even if it only happened once.
title: "[Pocket KGS bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        You don't need technical knowledge to report a problem. Describe it in your own words, even if it happened only once. Fill in whatever you know; we can ask follow-up questions.

        **Reports are public.** Please hide passwords, email addresses, and private conversations in screenshots. Only attach logs after checking them and removing private information.

        Prefer email? You can also report app problems to [hoshihatchery@gmail.com](mailto:hoshihatchery@gmail.com). For account recovery or moderation, contact [KGS support](https://amywarble.github.io/hoshi-hub/support/#kgs-account-server-or-moderation-help). Report [security vulnerabilities privately](https://github.com/amywarble/hoshi-hub/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: What were you trying to do, and what happened instead?
      placeholder: I was watching a game. When I turned my phone sideways, the board disappeared.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing before this happened?
      description: Optional. It's okay if you don't remember or can't make it happen again.
      placeholder: I opened a game from the game list, then turned my phone sideways.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Optional. Skip this if you already explained it above.
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - It happened once
        - Sometimes
        - Every time I try
        - I'm not sure
      default: 3
  - type: textarea
    id: additional
    attributes:
      label: Anything else? Screenshots are welcome.
      description: Optional. You can paste or drag screenshots here. Hide private information first. Logs are not required.
  - type: input
    id: app-version
    attributes:
      label: Pocket KGS version
      description: Optional. Find this on the About screen or in Android app information. Leave it blank if you can't find it.
      placeholder: For example, 0.1.0
  - type: input
    id: android-version
    attributes:
      label: What phone or tablet are you using?
      description: Optional. Include the Android version if you know it.
      placeholder: For example, a Google Pixel 9 running Android 16
