title: Hoshi Hub
description: Downloads, documentation, privacy, safety, and support for Pocket KGS, KGS Nova, and the Mobi GTP bridge.
remote_theme: just-the-docs/just-the-docs@v0.12.0
url: "https://amywarble.github.io"
baseurl: "/hoshi-hub"
repository: amywarble/hoshi-hub
color_scheme: dark
lang: en
search_enabled: false

plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from

exclude:
  - .cache
  - .codex-temp
  - .jekyll-cache
  - .sass-cache
  - README.md
  - AGENTS.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
